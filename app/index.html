<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <!-- قيمة base href تتبدل وقت البناء بـ --base-href -->
  <base href="/zyooti-web/app/">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="description" content="زيوتي: زيوت وفلاتر السيارات بالنجف، توصيل مجاني والدفع عند الاستلام">
  <meta name="theme-color" content="#2E2A6B">

  <!-- iOS -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="زيوتي">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>زيوتي</title>
  <link rel="manifest" href="manifest.json">

  <!-- يبدأ تحميل المحرك والخط مبكراً -->
  <link rel="preload" href="assets/assets/fonts/Tajawal-Bold.ttf" as="font" type="font/ttf" crossorigin>

  <style>
    html, body { margin: 0; height: 100%; background: #FFFFFF; }
    /* شاشة افتتاح بالشعار لحد ما يجهز التطبيق، بدل صفحة بيضاء */
    #splash {
      position: fixed; inset: 0; display: flex; flex-direction: column;
      align-items: center; justify-content: center; gap: 18px;
      background: #FFFFFF; transition: opacity .35s ease; z-index: 9;
    }
    #splash img { width: 88px; height: 88px; border-radius: 24px; box-shadow: 0 10px 30px rgba(46,42,107,.25); }
    #splash .bar { width: 120px; height: 4px; border-radius: 4px; background: #ECEBF3; overflow: hidden; }
    #splash .bar::after {
      content: ""; display: block; width: 40%; height: 100%; border-radius: 4px; background: #2E2A6B;
      animation: slide 1s ease-in-out infinite;
    }
    @keyframes slide { 0% { transform: translateX(160%); } 100% { transform: translateX(-260%); } }
    #splash.hide { opacity: 0; pointer-events: none; }
  </style>
</head>
<body>
  <div id="splash">
    <img src="icons/Icon-192.png" alt="زيوتي">
    <div class="bar"></div>
  </div>
  <script>
    // تختفي شاشة الافتتاح من يرسم Flutter أول صفحة
    window.addEventListener('flutter-first-frame', function () {
      var s = document.getElementById('splash');
      if (!s) return;
      s.classList.add('hide');
      setTimeout(function () { s.remove(); }, 400);
    });
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
